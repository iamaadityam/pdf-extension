<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Notes - Central Library</title>
  <style>.layout{height:calc(100vh - 49px);display:flex}.sidebar{border-right:1px solid var(--border);background:var(--surface);width:320px;overflow-y:auto}.content{flex:1;padding:20px;overflow-y:auto}.doc-item{border-bottom:1px solid var(--border);cursor:pointer;padding:12px}.doc-item:hover,.doc-item.active{background:#f0f9ff}</style>
  <script type="module" crossorigin src="/assets/library.html-Dcuxb1SN.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/styles-CP8UiGb0.js">
  <link rel="modulepreload" crossorigin href="/assets/database-CceYqlYd.js">
  <link rel="stylesheet" crossorigin href="/assets/styles-DP7o8Jx4.css">
</head>
<body>
  <header>
    <h1>PDF Notes Library</h1>
    <div>
      <button id="btn-export-json" class="btn">Backup JSON</button>
      <button id="btn-import-json" class="btn">Restore JSON</button>
      <input type="file" id="file-import" accept=".json" style="display: none;">
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div style="padding: 12px; border-bottom: 1px solid var(--border);">
        <input type="text" id="doc-search" placeholder="Filter documents...">
      </div>
      <div id="document-list"></div>
    </div>

    <div class="content">
      <div id="main-view">
        <div style="color: var(--muted); margin-top: 50px; text-align: center;">
          Select a document from the left sidebar to inspect notes and exports.
        </div>
      </div>
    </div>
  </div>

</body>
</html>
